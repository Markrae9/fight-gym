<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Fight Gym — Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1016;color:#eef3f8;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.brand,.stats,.panel{background:#101923dd;border:1px solid #344353;border-radius:14px;backdrop-filter:blur(10px);box-shadow:0 8px 28px #0005}.brand{padding:10px 13px}.brand b{display:block;letter-spacing:.1em;font-size:12px}.brand small{color:#9aabba;font-size:11px}.stats{padding:9px 11px;font-size:12px;line-height:1.7;text-align:right}.stats strong{color:#f3bd61}.actions{position:absolute;top:95px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}.btn{border:1px solid #536579;background:#162433eF;color:#f2f6fa;border-radius:11px;padding:10px 12px;font-size:12px;font-weight:700;min-width:106px;box-shadow:0 5px 16px #0004}.btn.active,.btn.primary{background:#e7a844;color:#17130b;border-color:#ffd27e}.bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.panel{padding:10px 12px;max-width:64%;font-size:12px;line-height:1.45}.panel b{color:#f4bd5d}.panel small{color:#9daebf}.controls{display:flex;gap:8px;pointer-events:auto}.round{width:58px;height:58px;border-radius:50%;background:#182838d9;border:1px solid #71849a;color:#fff;font-size:11px;font-weight:800}.round:active,.btn:active{transform:scale(.97)}#stick{position:absolute;left:20px;bottom:100px;width:116px;height:116px;border-radius:50%;border:1px solid #91a2b555;background:#0d1827aa;pointer-events:auto;touch-action:none}#nub{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#dca64fe8;border:2px solid #ffe0a1;box-shadow:0 4px 15px #0008}#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#dce7f1aa;font-size:12px;text-align:center;pointer-events:none;text-shadow:0 2px 6px #000}.toast{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:#111d2beF;border:1px solid #52667c;border-radius:12px;padding:12px 16px;font-size:13px;display:none;max-width:85%;text-align:center}.bar{height:5px;background:#344456;border-radius:8px;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;background:#e7a844;width:60%}@media(min-width:700px){.top{left:22px;right:22px;top:20px}.actions{right:22px;top:100px}.bottom{left:22px;right:22px;bottom:20px}#stick{left:24px;bottom:110px}}
</style>
</head>
<body><div id="game"></div><div id="hud">
<div class="top"><div class="brand"><b>FIGHT GYM</b><small>COACH CAREER · PROTOTYPE</small></div><div class="stats">CASH <strong id="cash">$1,250</strong><br>GYM RANK <strong>Rookie I</strong></div></div>
<div class="actions"><button class="btn active" id="gymBtn">MY GYM</button><button class="btn" id="arenaBtn">FIGHT ARENA</button><button class="btn" id="trainBtn">TRAIN FIGHTER</button><button class="btn" id="fightBtn">START SPAR</button></div>
<div id="stick"><div id="nub"></div></div><div id="hint">DRAG TO MOVE<br>DRAG RIGHT SIDE TO LOOK</div>
<div class="bottom"><div class="panel"><b id="place">MY GYM</b><br><span id="message">Move around and explore your gym.</span><div class="bar"><span id="energy"></span></div><small>TEAM CONDITION</small></div><div class="controls"><button class="round" id="interact">INTERACT</button><button class="round" id="jump">DODGE</button></div></div><div class="toast" id="toast"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=>{'use strict';const root=document.getElementById('game');if(!window.THREE){document.getElementById('message').textContent='Three.js did not load. Check internet access and reload.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111b26);scene.fog=new THREE.Fog(0x111b26,22,65);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc6d9f0,0x29303a,1.6));const key=new THREE.DirectionalLight(0xffe2bd,2.3);key.position.set(-8,15,8);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const fill=new THREE.PointLight(0x4386bd,1.4,32);fill.position.set(4,5,-5);scene.add(fill);
const mat=(color,rough=.8,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});const mats={floor:mat(0x252d35),rubber:mat(0x171d24),wall:mat(0x303d49),dark:mat(0x10161c),steel:mat(0x71808b,.4,.65),gold:mat(0xd69b3d,.42,.3),red:mat(0x9d353b),blue:mat(0x315e91),white:mat(0xdce3e8),green:mat(0x47775f)};let world='gym',cash=1250,condition=64,player,playerModel=null,clock=new THREE.Clock(),yaw=0,pitch=.18,move={x:0,y:0},dragLook=null,toastTimer=null, fighters=[], mixers=[];
function mesh(geo,material,x,y,z,par=scene){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;par.add(o);return o}function box(w,h,d,material,x,y,z,par=scene){return mesh(new THREE.BoxGeometry(w,h,d),material,x,y,z,par)}function cyl(rt,rb,h,material,x,y,z,par=scene,segments=16){return mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material,x,y,z,par)}function sphere(r,material,x,y,z,par=scene){return mesh(new THREE.SphereGeometry(r,16,12),material,x,y,z,par)}
function floor(w,d,x,z,material){const o=box(w,.2,d,material,x,-.12,z);o.receiveShadow=true;return o}function line(x1,z1,x2,z2,thick,material,y=.015){const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);const o=box(len,.025,thick,material,(x1+x2)/2,y,(z1+z2)/2);o.rotation.y=-Math.atan2(dz,dx);return o}
function makeBag(x,z){cyl(.36,.4,1.55,mat(0x252d34),x,1.35,z);cyl(.38,.38,.08,mats.gold,x,2.14,z);cyl(.39,.39,.1,mats.dark,x,.55,z);line(x-.6,z,x+.6,z,.045,mats.steel,2.25)}function makeRack(x,z){for(let zz of [z-.9,z+.9]){cyl(.07,.07,2.1,mats.steel,x,1,zz);cyl(.1,.1,.12,mats.gold,x,1.9,zz)}for(let y of [.65,1.25,1.85]){line(x,z-.9,x,z+.9,.06,mats.steel,y)}for(let i=0;i<5;i++){const weight=cyl(.13,.13,.22,mat(0x202932,.55,.35),x,.72+i*.02,z-.65+i*.31);weight.rotation.z=Math.PI/2}}
function buildGym(){floor(30,30,0,0,mats.floor);floor(24,20,0,0,mat(0x323b43));for(let x of [-12,12])box(.35,5,25,mats.wall,x,2.4,0);for(let z of [-10,10])box(24,5,.35,mats.wall,0,2.4,z);for(let z of [-7,7])for(let x of [-9,-6,-3,0,3,6,9]){box(.08,4,.08,mats.steel,x,2.2,z);sphere(.12,mats.gold,x,4.15,z)}
// octagon platform
const oct=new THREE.Group();oct.position.set(0,0,-1.5);scene.add(oct);cyl(4.8,4.8,.32,mats.dark,0,.1,0,oct,8);cyl(4.55,4.55,.12,mat(0x384752),0,.32,0,oct,8);const points=[];for(let i=0;i<8;i++){let a=Math.PI/8+i*Math.PI/4;points.push([Math.cos(a)*4.5,Math.sin(a)*4.5])}for(let i=0;i<8;i++){const a=points[i],b=points[(i+1)%8];line(a[0],a[1],b[0],b[1],.09,mats.white,.6);for(let h of [0.85,1.25,1.65]){const rail=box(Math.hypot(b[0]-a[0],b[1]-a[1]),.055,.055,mats.white,(a[0]+b[0])/2,h,(a[1]+b[1])/2,oct);rail.rotation.y=-Math.atan2(b[1]-a[1],b[0]-a[0])}for(let h of [.65,1.05,1.45,1.85])cyl(.035,.035,.09,mats.gold,a[0],h,a[1],oct)}
// gym equipment
makeBag(-8,-6);makeBag(-6,-6);makeBag(8,-6);makeRack(-9,1);makeRack(9,1);box(3,.45,1.1,mats.dark,-7, .35,4);box(2.6,.12,.85,mats.red,-7,.65,4);cyl(.12,.12,1.2,mats.steel,-8.2,.3,4);cyl(.12,.12,1.2,mats.steel,-5.8,.3,4);box(3,.3,1.2,mats.dark,7,.25,4);box(2.6,.12,.85,mats.blue,7,.48,4);for(let i=0;i<5;i++){cyl(.12,.12,.18,mats.gold,-2+i, .15,7);cyl(.12,.12,.18,mats.steel,-2+i,.34,7)}
// signs
box(5,1.2,.16,mats.dark,0,3.7,-9.65);const canvas=document.createElement('canvas');canvas.width=512;canvas.height=128;const ctx=canvas.getContext('2d');ctx.fillStyle='#10161c';ctx.fillRect(0,0,512,128);ctx.fillStyle='#e7a844';ctx.font='bold 46px Arial';ctx.textAlign='center';ctx.fillText('FIGHT CAMP',256,79);const tex=new THREE.CanvasTexture(canvas);const sign=new THREE.Mesh(new THREE.PlaneGeometry(4.8,1.1),new THREE.MeshBasicMaterial({map:tex}));sign.position.set(0,3.7,-9.54);scene.add(sign);
// columns and lights
for(let x of [-10,10])for(let z of [-8,0,8]){cyl(.18,.22,4.7,mats.dark,x,2.3,z);const lamp=mesh(new THREE.BoxGeometry(1.2,.12,.4),new THREE.MeshBasicMaterial({color:0xffd89a}),x,4.5,z);const pl=new THREE.PointLight(0xffd79a,.65,12);pl.position.set(x,4.2,z);scene.add(pl)}
}
function buildArena(){floor(34,34,0,0,mat(0x151d27));for(let x of [-15,15])box(.3,6,30,mats.dark,x,3,0);for(let z of [-15,15])box(30,6,.3,mats.dark,0,3,z);const spot=new THREE.SpotLight(0xffe2bb,3,35,Math.PI/4,.5,1);spot.position.set(0,13,0);spot.target.position.set(0,0,0);scene.add(spot,spot.target);const stage=cyl(6.5,6.5,.5,mats.dark,0,.1,0,scene,8);cyl(6.2,6.2,.15,mat(0x3c4b57),0,.42,0,scene,8);for(let i=0;i<8;i++){let a=Math.PI/8+i*Math.PI/4,b=a+Math.PI/4,x1=Math.cos(a)*5.9,z1=Math.sin(a)*5.9,x2=Math.cos(b)*5.9,z2=Math.sin(b)*5.9;line(x1,z1,x2,z2,.12,mats.white,.85);for(let h of [1.1,1.6,2.1]){const rail=box(Math.hypot(x2-x1,z2-z1),.06,.06,mats.white,(x1+x2)/2,h,(z1+z2)/2);rail.rotation.y=-Math.atan2(z2-z1,x2-x1)}cyl(.07,.07,2.2,mats.gold,x1,1.1,z1)}for(let x of [-10,-5,0,5,10]){const light=new THREE.PointLight(0xffe5c1,1.3,16);light.position.set(x,5,-10);scene.add(light)} }
function makeFighter(color,x,z,scale=1){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const skin=mat(0xb9825d),shirt=mat(color),shorts=mat(0x202a35),glove=mat(0x171b21,.5);const torso=cyl(.33,.42,.8,shirt,0,1.35,0,g);torso.rotation.z=.04;sphere(.23,skin,0,1.95,0,g);cyl(.14,.14,.18,skin,0,1.77,0,g);for(let s of [-1,1]){const arm=cyl(.105,.14,.56,skin,s*.42,1.42,0,g);arm.rotation.z=s*.3;const gloveMesh=sphere(.14,glove,s*.54,1.2,-.04,g);gloveMesh.scale.set(1,.85,1);const leg=cyl(.13,.17,.65,skin,s*.18,.63,0,g);leg.rotation.z=-s*.06;box(.2,.12,.34,shorts,s*.18,.2,-.07,g)}g.scale.setScalar(scale);g.userData={torso,arms:[],baseY:0,phase:Math.random()*6};fighters.push(g);return g}
function loadCoach(){player=new THREE.Group();scene.add(player);player.position.set(0,0,5);const skin=mat(0xc08a64),shirt=mat(0xd39b3e),pants=mat(0x222c37),shoe=mat(0x10151b);cyl(.28,.34,.7,shirt,0,1.35,0,player);sphere(.2,skin,0,1.9,0,player);cyl(.12,.12,.16,skin,0,1.72,0,player);for(let s of [-1,1]){const arm=cyl(.09,.12,.55,skin,s*.36,1.35,0,player);arm.rotation.z=s*.24;cyl(.12,.14,.65,pants,s*.14,.55,0,player);box(.19,.1,.28,shoe,s*.14,.17,-.04,player)}player.userData.base=0;
// try loading a freely hosted animated GLB as a temporary model; fallback remains procedural
if(THREE.GLTFLoader){const loader=new THREE.GLTFLoader();loader.load('https://threejs.org/examples/models/gltf/Soldier.glb',gltf=>{if(!player)return;const model=gltf.scene;model.scale.setScalar(.9);model.position.y=0;player.visible=false;scene.add(model);playerModel=model;if(gltf.animations.length){const mixer=new THREE.AnimationMixer(model);mixers.push(mixer);const idle=gltf.animations.find(a=>/idle/i.test(a.name))||gltf.animations[0];mixer.clipAction(idle).play()}},undefined,()=>{});}
}
function clearArenaOnly(){for(const o of [...scene.children]){if(o.userData&&o.userData.transient){scene.remove(o)}}}
function setWorld(next){world=next;document.getElementById('gymBtn').classList.toggle('active',next==='gym');document.getElementById('arenaBtn').classList.toggle('active',next==='arena');document.getElementById('place').textContent=next==='gym'?'MY GYM':'FIGHT ARENA';document.getElementById('message').textContent=next==='gym'?'Move around and explore your gym.':'Sparring arena loaded. Start a practice fight.';scene.clear();scene.background=new THREE.Color(next==='gym'?0x111b26:0x080d14);scene.fog=new THREE.Fog(next==='gym'?0x111b26:0x080d14,22,65);scene.add(new THREE.HemisphereLight(0xc6d9f0,0x29303a,1.6));const d=new THREE.DirectionalLight(0xffe2bd,2.3);d.position.set(-8,15,8);d.castShadow=true;scene.add(d);const f=new THREE.PointLight(0x4386bd,1.4,32);f.position.set(4,5,-5);scene.add(f);fighters=[];mixers=[];if(next==='gym')buildGym();else buildArena();loadCoach();makeFighter(0x8d3338,-1.25,-1.1,.95);makeFighter(0x315e91,1.25,-1.1,.95);makeFighter(0x47775f,8,2,.88);makeFighter(0xb6a18a,-8,2,.88);if(next==='arena'){player.position.set(0,0,10)}else player.position.set(0,0,5);camera.position.set(player.position.x,player.position.y+3,player.position.z+7);yaw=0;}
function notify(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2400)}
// controls joystick
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let stickId=null;function setStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,lim=35,len=Math.hypot(dx,dy)||1,k=Math.min(1,lim/len);move.x=dx*k/lim;move.y=dy*k/lim;nub.style.left=(33+dx*k)+'px';nub.style.top=(33+dy*k)+'px'}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});function resetStick(){stickId=null;move={x:0,y:0};nub.style.left='33px';nub.style.top='33px'}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.45&&e.clientY>innerHeight*.5)return;dragLook={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(dragLook&&e.pointerId===dragLook.id){yaw-=(e.clientX-dragLook.x)*.006;pitch=Math.max(-.12,Math.min(.6,pitch+(e.clientY-dragLook.y)*.003));dragLook.x=e.clientX;dragLook.y=e.clientY}});renderer.domElement.addEventListener('pointerup',()=>dragLook=null);renderer.domElement.addEventListener('pointercancel',()=>dragLook=null);
document.getElementById('gymBtn').onclick=()=>setWorld('gym');document.getElementById('arenaBtn').onclick=()=>setWorld('arena');document.getElementById('trainBtn').onclick=()=>{condition=Math.min(100,condition+12);cash=Math.max(0,cash-50);document.getElementById('cash').textContent='$'+cash.toLocaleString();document.getElementById('energy').style.width=condition+'%';document.getElementById('message').textContent='Training complete: condition improved.';notify('Training session complete · +12 condition · $50 spent')};document.getElementById('fightBtn').onclick=()=>{if(world!=='arena'){notify('Enter the fight arena first.');return}const win=Math.random()>.36;cash+=win?180:45;condition=Math.max(20,condition-(win?12:20));document.getElementById('cash').textContent='$'+cash.toLocaleString();document.getElementById('energy').style.width=condition+'%';document.getElementById('message').textContent=win?'Sparring win! Your fighter gained experience.':'Sparring loss. Recover and train before the next fight.';fighters.slice(0,2).forEach((f,i)=>{f.userData.punch=1.1+i*.2});notify(win?'SPARRING WIN · +$180':'SPARRING LOSS · +$45 participation money')};document.getElementById('interact').onclick=()=>{let nearest=null,dist=Infinity;for(const f of fighters){const d=f.position.distanceTo(player.position);if(d<dist){dist=d;nearest=f}}if(dist<3.5){notify('Fighter nearby · Practice and management features are prototype systems.')}else if(world==='gym'){notify('Walk near equipment or fighters to interact.')}else{notify('Arena ready · use START SPAR to simulate a match.')}};document.getElementById('jump').onclick=()=>{player.userData.dodge=.32;notify('Dodge!')};
setWorld('gym');
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);for(const m of mixers)m.update(dt);if(player){const speed=4.2;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const v=forward.multiplyScalar(-move.y).add(right.multiplyScalar(move.x));if(v.lengthSq()>0){v.normalize();player.position.addScaledVector(v,speed*dt);player.rotation.y=Math.atan2(v.x,v.z)}if(player.userData.dodge>0){player.userData.dodge-=dt;player.position.y=Math.max(0,Math.sin((.32-player.userData.dodge)/.32*Math.PI)*.22)}else player.position.y=0;const target=new THREE.Vector3(player.position.x+Math.sin(yaw)*Math.cos(pitch)*7,player.position.y+2.7+pitch*2,player.position.z+Math.cos(yaw)*Math.cos(pitch)*7);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1.25,player.position.z);if(playerModel){playerModel.position.copy(player.position);playerModel.rotation.copy(player.rotation)} }
for(const f of fighters){f.userData.phase+=dt;const swing=f.userData.punch||0;if(swing>0){f.position.x+=Math.sin(f.userData.phase*15)*.008;f.userData.punch=Math.max(0,swing-dt)}else f.position.y=Math.sin(f.userData.phase*2)*.018}
renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('hint').style.opacity='1';setTimeout(()=>document.getElementById('hint').style.opacity='0',6000);
})();
</script></body></html>
